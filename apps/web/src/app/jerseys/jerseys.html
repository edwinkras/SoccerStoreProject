<div class="d-flex justify-content-center pt-5 gap-5">
  @for (jersey of jerseys; track jersey.id) {
  <div class="card" style="width: 18rem;">
    <img class="rounded-4 img-fluid" src="/jersey.jpg" alt="Jersey">
    <div class="card-body">
      <h5 class="card-title">{{ jersey.name }}</h5>
      <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
      <a routerLink="/checkout" class="btn btn-primary">Buy it</a>
    </div>
  </div>
  }
</div>
